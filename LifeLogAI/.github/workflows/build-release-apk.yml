name: Build LifeLogAI Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components (API 35)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            echo "Signing release APK with configured GitHub Secrets."
          else
            echo "Warning: Signing secrets are not configured. Building unsigned release APK."
            echo "Note: Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to produce a signed installable release APK." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Locate generated Release APK
        shell: bash
        run: |
          mkdir -p build-artifacts/release
          while IFS= read -r -d '' apk; do
            cp "$apk" build-artifacts/release/
          done < <(find . -path "*/build/outputs/apk/release/*.apk" -type f -print0)
          ls -lh build-artifacts/release/
          if [ -z "$(ls -A build-artifacts/release)" ]; then
            echo "Error: No release APK was generated." >&2
            exit 1
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLogAI-Release-APK
          path: build-artifacts/release/*.apk
          if-no-files-found: error
