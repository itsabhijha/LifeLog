name: Build LifeLogAI Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components (API 35)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate generated Debug APK
        shell: bash
        run: |
          mkdir -p build-artifacts/debug
          while IFS= read -r -d '' apk; do
            cp "$apk" build-artifacts/debug/
          done < <(find . -path "*/build/outputs/apk/debug/*.apk" -type f -print0)
          ls -lh build-artifacts/debug/
          if [ -z "$(ls -A build-artifacts/debug)" ]; then
            echo "Error: No debug APK was generated." >&2
            exit 1
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLogAI-APK
          path: build-artifacts/debug/*.apk
          if-no-files-found: error
